name: Release

# Push a tag like v0.1.0. gh-extension-precompile builds every OS/arch, which is what
# `gh extension install nmloc/gh-achievements` downloads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          generate_attestations: true
          # One argument (the action quotes it): keeps the action's -s -w and stamps the version.
          go_build_options: -ldflags=-s -w -X main.version=${{ github.ref_name }}
